plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vaapps.tiltguard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vaapps.tiltguard'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    // Fixed key so each new build installs over the last one.
    // Fine for sideloading; use a private key for the Play Store.
    signingConfigs {
        sideload {
            storeFile file('tiltguard-sideload.keystore')
            storePassword 'android'
            keyAlias 'tiltguard'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
