plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vaapps.tiltguard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vaapps.tiltguard'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs right away.
            // Swap in your own keystore before publishing to the Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
